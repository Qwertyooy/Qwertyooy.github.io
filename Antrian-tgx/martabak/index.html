<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antrian Martabak</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-amber-50 min-h-screen">

    <nav class="fixed top-0 w-full z-50 flex items-center justify-between px-8 py-4 bg-white/80 backdrop-blur-md border-b border-amber-100 shadow-sm">
        <div class="flex items-center gap-2">
            <div class="h-8 w-8 bg-amber-500 rounded-lg flex items-center justify-center text-white font-bold text-lg">A</div>
            <h1 class="font-bold text-xl tracking-tight text-amber-900">Antrian-<span class="text-amber-500">TGX</span></h1>
        </div>
    </nav>

    <section class="min-h-screen flex flex-col gap-6 justify-center items-center px-4 pt-20">
        <div class="w-full max-w-md bg-white rounded-3xl shadow-xl shadow-amber-900/5 border border-amber-100 overflow-hidden">
            <div class="bg-amber-400 flex flex-col items-center text-center gap-2 py-16 px-6">
                <p class="text-amber-900 text-sm font-medium uppercase tracking-widest">Sedang dikerjakan</p>
                <h1 id="nomorAktif" class="text-amber-900 font-bold leading-none" style="font-size: 9rem;">—</h1>
                <p class="text-amber-800 text-sm mt-2">Nomor lain harap bersabar 🙏</p>
            </div>
        </div>

        <a href="/Antrian-tgx" class="w-64 bg-amber-500 hover:bg-amber-600 text-white font-semibold py-3 px-6 rounded-2xl shadow-lg shadow-amber-500/20 active:scale-[0.98] transition-all duration-150 flex items-center justify-center gap-2">
                    <span>Kembali</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"></path>
                    </svg>
                </a>
    </section>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { 
        getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        import firebaseConfig from "../firebase-config.js";

         const app = initializeApp(firebaseConfig);
         const db = getFirestore(app);
        onSnapshot(
            query(collection(db, "pesanan"), orderBy("nomor")),
            (snapshot) => {
                let nomorAktif = null;

                snapshot.forEach((docSnap) => {
                    const d = docSnap.data();
                    // Ambil nomor "diproses" terkecil = yang sedang dikerjakan
                    if (d.status === "diproses") {
                        if (nomorAktif === null || d.nomor < nomorAktif) {
                            nomorAktif = d.nomor;
                        }
                    }
                });

                document.getElementById("nomorAktif").textContent = nomorAktif !== null
                    ? String(nomorAktif).padStart(2, "0")
                    : "—";
            }
        );
    </script>
</body>
</html>
