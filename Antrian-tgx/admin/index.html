<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin Panel TGX</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-amber-50 min-h-screen" id="halamanAdmin" style="display:none">

    <!-- NAVBAR -->
    <nav class="fixed top-0 left-0 w-full z-50 flex items-center justify-between px-8 py-3.5 bg-white border-b border-amber-100 shadow-sm">
        <div class="flex items-center gap-2.5">
            <div class="h-8 w-8 bg-amber-500 rounded-lg flex items-center justify-center text-white font-bold text-lg">A</div>
            <h1 class="font-bold text-xl tracking-tight text-amber-900">Antrian-<span class="text-amber-500">TGX</span></h1>
        </div>
        <div class="flex items-center gap-3">
            <span class="text-xs font-semibold text-amber-700 bg-amber-100 px-3 py-1 rounded-full">Secure Access</span>
            <button
                id="btnLogout"
                class="bg-red-500 hover:bg-red-600 text-white font-medium px-3.5 py-1.5 rounded-lg transition text-xs flex items-center gap-1.5 shadow-sm"
            >
                🚪 Keluar
            </button>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="max-w-6xl mx-auto pt-24 pb-10 px-6">

        <!-- STAT CARDS -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div class="bg-white rounded-xl border border-amber-100 shadow-sm p-5 flex items-center gap-4">
                <div class="h-11 w-11 bg-green-100 rounded-xl flex items-center justify-center text-xl">💰</div>
                <div>
                    <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-0.5">Total Pendapatan Hari Ini</p>
                    <p id="totalPendapatan" class="text-2xl font-bold text-green-600">Rp 0</p>
                </div>
            </div>
            <div class="bg-white rounded-xl border border-amber-100 shadow-sm p-5 flex items-center gap-4">
                <div class="h-11 w-11 bg-amber-100 rounded-xl flex items-center justify-center text-xl">📋</div>
                <div>
                    <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-0.5">Antrean Aktif</p>
                    <p class="text-2xl font-bold text-amber-600">— Realtime</p>
                </div>
            </div>
        </div>

        <!-- GRID UTAMA -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-5">

            <!-- KOLOM KIRI: Tambah Menu + Daftar Menu -->
            <div class="flex flex-col gap-5">

                <!-- Form Tambah Menu -->
                <div class="bg-white rounded-xl border border-amber-100 shadow-sm p-5">
                    <h3 class="text-xs font-bold uppercase tracking-widest text-amber-600 mb-4 flex items-center gap-1.5">
                        ➕ Tambah Menu Baru
                    </h3>
                    <div class="space-y-2.5">
                        <input
                            type="text"
                            id="inputNamaMenu"
                            placeholder="Nama menu (ex: Martabak Telur)"
                            class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-transparent bg-amber-50 placeholder-gray-400 transition"
                        />
                        <input
                            type="number"
                            id="inputHargaMenu"
                            placeholder="Harga (ex: 20000)"
                            class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-transparent bg-amber-50 placeholder-gray-400 transition"
                        />
                        <button
                            onclick="simpanMenuBaru()"
                            class="w-full bg-amber-500 hover:bg-amber-600 text-white text-sm font-semibold py-2.5 rounded-lg transition shadow-sm flex items-center justify-center gap-2"
                        >
                            💾 Simpan Menu
                        </button>
                    </div>
                </div>

                <!-- Pilih Menu -->
                <div class="bg-white rounded-xl border border-amber-100 shadow-sm p-5">
                    <h3 class="text-xs font-bold uppercase tracking-widest text-amber-600 mb-4">
                        🛒 Pilih Menu Pesanan
                    </h3>
                    <div id="daftarMenu" class="space-y-2"></div>
                </div>

            </div>

            <!-- KOLOM KANAN: Keranjang + Tabel Antrean -->
            <div class="md:col-span-2 flex flex-col gap-5">

                <!-- Keranjang -->
                <div class="bg-white rounded-xl border border-amber-100 shadow-sm p-5">
                    <h3 class="text-xs font-bold uppercase tracking-widest text-amber-600 mb-4 flex items-center gap-1.5">
                        🧾 Keranjang Pesanan
                    </h3>
                    <div id="keranjang" class="space-y-2">
                        <p class="text-sm text-gray-400 italic">Belum ada pesanan</p>
                    </div>
                </div>

                <!-- Tabel Antrean -->
                <div class="bg-white rounded-xl border border-amber-100 shadow-sm p-5">
                    <h3 class="text-xs font-bold uppercase tracking-widest text-amber-600 mb-4 flex items-center gap-1.5">
                        📋 Daftar Antrean Saat Ini
                    </h3>
                    <div class="overflow-x-auto rounded-lg border border-gray-100">
                        <table class="w-full text-left border-collapse bg-white">
                            <thead class="bg-amber-50 border-b border-amber-100 text-gray-500 text-xs font-semibold uppercase tracking-wide">
                                <tr>
                                    <th class="px-4 py-3">Nomor</th>
                                    <th class="px-4 py-3">Pesanan</th>
                                    <th class="px-4 py-3">Total</th>
                                    <th class="px-4 py-3">Status</th>
                                    <th class="px-4 py-3 text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="tabelAntreanAdmin" class="text-sm divide-y divide-gray-50">
                                <tr>
                                    <td colspan="5" class="px-4 py-6 text-center text-gray-400 italic text-sm">Memuat data...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db } from './main.js';
        import {
            collection,
            addDoc,
            updateDoc,
            deleteDoc,
            doc,
            onSnapshot,
            query,
            orderBy,
            serverTimestamp,
            getDocs
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        import {
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        // ------------------------------------------
        // AUTENTIKASI USER (CEK LOGIN)
        // ------------------------------------------
        const halamanAdmin = document.getElementById('halamanAdmin');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                halamanAdmin.style.display = "block";
            } else {
                window.location.href = "login.html";
            }
        });

        // ------------------------------------------
        // PROSES LOGOUT
        // ------------------------------------------
        document.getElementById("btnLogout").addEventListener("click", async () => {
            const konfirmasi = confirm("Apakah kamu yakin ingin keluar?");
            if (konfirmasi) {
                try {
                    await signOut(auth);
                    window.location.href = "login.html";
                } catch (error) {
                    alert("Gagal logout: " + error.message);
                }
            }
        });

        // ------------------------------------------
        // MANAGEMENT KERANJANG BELANJA
        // ------------------------------------------
        let keranjang = [];

        window.tambahKeKeranjang = function(nama, harga) {
            const itemSudahAda = keranjang.find(item => item.nama === nama);

            if (itemSudahAda) {
                itemSudahAda.qty++;
            } else {
                keranjang.push({ nama, harga, qty: 1 });
            }
            renderKeranjang();
        };

        window.tambahQty = function(index) {
            keranjang[index].qty++;
            renderKeranjang();
        };

        window.kurangiQty = function(index) {
            keranjang[index].qty--;
            if (keranjang[index].qty <= 0) {
                keranjang.splice(index, 1);
            }
            renderKeranjang();
        };

        function renderKeranjang() {
            const divKeranjang = document.getElementById("keranjang");

            if (keranjang.length === 0) {
                divKeranjang.innerHTML = `<p class="text-sm text-gray-400 italic">Belum ada pesanan</p>`;
                return;
            }

            divKeranjang.innerHTML = "";
            let total = 0;

            keranjang.forEach((item, index) => {
                const subtotal = item.harga * item.qty;
                total += subtotal;

                divKeranjang.innerHTML += `
                    <div class="flex justify-between items-center bg-amber-50 border border-amber-100 rounded-lg px-3 py-2.5">
                        <div>
                            <p class="text-sm font-semibold text-gray-800">${item.nama}</p>
                            <p class="text-xs text-gray-500">Rp ${item.harga.toLocaleString()} &times; ${item.qty} = <span class="font-medium text-amber-700">Rp ${subtotal.toLocaleString()}</span></p>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <button onclick="kurangiQty(${index})" class="h-7 w-7 flex items-center justify-center bg-white border border-gray-200 hover:bg-red-50 hover:border-red-300 text-gray-600 hover:text-red-600 rounded-md font-bold text-base transition">−</button>
                            <span class="text-sm font-semibold text-gray-800 w-5 text-center">${item.qty}</span>
                            <button onclick="tambahQty(${index})" class="h-7 w-7 flex items-center justify-center bg-white border border-gray-200 hover:bg-green-50 hover:border-green-300 text-gray-600 hover:text-green-600 rounded-md font-bold text-base transition">+</button>
                        </div>
                    </div>
                `;
            });

            divKeranjang.innerHTML += `
                <div class="mt-3 pt-3 border-t border-gray-100">
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-sm font-semibold text-gray-600">Total Pesanan</span>
                        <span class="text-lg font-bold text-green-600">Rp ${total.toLocaleString()}</span>
                    </div>
                    <button onclick="checkoutPesanan()" class="w-full bg-green-500 hover:bg-green-600 text-white text-sm font-semibold py-2.5 rounded-lg shadow-sm transition flex items-center justify-center gap-2">
                        🚀 Checkout Pesanan
                    </button>
                </div>
            `;
        }

        // ------------------------------------------
        // PROSES CHECKOUT PESANAN KE FIREBASE
        // ------------------------------------------
        window.checkoutPesanan = async function() {
            if (keranjang.length === 0) {
                alert("Keranjang kosong!");
                return;
            }

            try {
                const snapshot = await getDocs(collection(db, "pesanan"));
                const nomorAntrean = snapshot.size + 1;
                const total = keranjang.reduce((sum, item) => sum + (item.harga * item.qty), 0);

                await addDoc(collection(db, "pesanan"), {
                    nomor: nomorAntrean,
                    items: keranjang,
                    total: total,
                    status: "diproses",
                    waktu: serverTimestamp()
                });

                keranjang = [];
                renderKeranjang();
            } catch(error) {
                console.error("Gagal melakukan checkout:", error);
                alert("Gagal menyimpan pesanan!");
            }
        };

        // ------------------------------------------
        // MENAMPILKAN DAFTAR MENU (REALTIME)
        // ------------------------------------------
        onSnapshot(collection(db, "menu"), (snapshot) => {
            const divMenu = document.getElementById('daftarMenu');

            if (snapshot.empty) {
                divMenu.innerHTML = `<p class="text-sm text-gray-400 italic">Belum ada pilihan menu tersedia.</p>`;
                return;
            }

            divMenu.innerHTML = "";
            snapshot.forEach((docSnap) => {
                const item = docSnap.data();
                divMenu.innerHTML += `
                    <button
                        onclick="tambahKeKeranjang('${item.nama}', ${item.harga})"
                        class="w-full text-left bg-gray-50 hover:bg-amber-50 px-3 py-2.5 rounded-lg flex justify-between items-center border border-gray-200 hover:border-amber-300 transition group"
                    >
                        <span class="text-sm font-medium text-gray-700 group-hover:text-amber-800">${item.nama}</span>
                        <span class="text-sm font-bold text-amber-600">Rp ${item.harga.toLocaleString()}</span>
                    </button>
                `;
            });
        });

        // ------------------------------------------
        // MENAMPILKAN DAFTAR ANTREAN ADMIN (REALTIME)
        // ------------------------------------------
        onSnapshot(
            query(collection(db, "pesanan"), orderBy("nomor")),
            (snapshot) => {
                const tbody = document.getElementById("tabelAntreanAdmin");
                tbody.innerHTML = "";
                let totalPendapatan = 0;

                if (snapshot.empty) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="5" class="px-4 py-6 text-center text-gray-400 italic text-sm">Belum ada antrean pesanan.</td>
                        </tr>
                    `;
                    document.getElementById("totalPendapatan").innerText = "Rp 0";
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const id = docSnap.id;

                    const nomor = data.nomor !== undefined ? data.nomor : "?";
                    const total = data.total || 0;
                    const status = data.status || "diproses";
                    const items = Array.isArray(data.items) ? data.items : [];

                    if (status === "selesai") {
                        totalPendapatan += total;
                    }

                    let daftarItem = "";
                    items.forEach((item) => {
                        daftarItem += `<div class="text-xs text-gray-500">• ${item.nama} (${item.qty}x)</div>`;
                    });

                    tbody.innerHTML += `
                        <tr class="hover:bg-amber-50 transition">
                            <td class="px-4 py-3 font-bold text-gray-700">#${nomor}</td>
                            <td class="px-4 py-3">${daftarItem || '<span class="text-red-400 italic text-xs">Kosong</span>'}</td>
                            <td class="px-4 py-3 font-semibold text-gray-800 whitespace-nowrap">Rp ${total.toLocaleString()}</td>
                            <td class="px-4 py-3">
                                ${
                                    status === "diproses"
                                    ? `<span class="bg-amber-100 text-amber-800 text-xs px-2.5 py-1 rounded-full font-semibold">⏳ Diproses</span>`
                                    : `<span class="bg-green-100 text-green-800 text-xs px-2.5 py-1 rounded-full font-semibold">✅ Selesai</span>`
                                }
                            </td>
                            <td class="px-4 py-3 text-center">
                                <div class="flex items-center justify-center gap-1.5 flex-wrap">
                                    ${
                                        status === "diproses"
                                        ? `<button onclick="selesaikanPesanan('${id}')" class="bg-green-500 hover:bg-green-600 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition shadow-sm">✓ Selesai</button>`
                                        : `<span class="text-gray-300 text-xs px-2">—</span>`
                                    }
                                    <button onclick="hapusPesanan('${id}', '${nomor}')" class="bg-red-500 hover:bg-red-600 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition shadow-sm">🗑️ Hapus</button>
                                </div>
                            </td>
                        </tr>
                    `;
                });

                document.getElementById("totalPendapatan").innerText = `Rp ${totalPendapatan.toLocaleString()}`;
            },
            (error) => {
                console.error("Gagal memuat antrean realtime:", error);
                alert("Gagal memuat data antrean.");
            }
        );

        // ------------------------------------------
        // UBAH STATUS PESANAN JADI SELESAI
        // ------------------------------------------
        window.selesaikanPesanan = async function(id) {
            try {
                await updateDoc(doc(db, "pesanan", id), { status: "selesai" });
            } catch(error) {
                console.error("Gagal memperbarui status:", error);
                alert("Gagal menyelesaikan pesanan!");
            }
        };

        // ------------------------------------------
        // HAPUS ORDERAN YANG SUDAH TERCHECKOUT
        // ------------------------------------------
        window.hapusPesanan = async function(id, nomorAntrean) {
            const konfirmasi = confirm(`Apakah kamu yakin ingin menghapus permanen pesanan #${nomorAntrean}?`);
            if (konfirmasi) {
                try {
                    await deleteDoc(doc(db, "pesanan", id));
                } catch (error) {
                    console.error("Gagal menghapus pesanan:", error);
                    alert("Gagal menghapus data dari server: " + error.message);
                }
            }
        };

        // ------------------------------------------
        // TAMBAH MENU BARU KE FIRESTORE
        // ------------------------------------------
        window.simpanMenuBaru = async function() {
            const namaMenu = document.getElementById("inputNamaMenu").value.trim();
            const hargaMenu = parseInt(document.getElementById("inputHargaMenu").value);

            if (!namaMenu || isNaN(hargaMenu)) {
                alert("Harap isi nama menu dan harga dengan benar!");
                return;
            }

            try {
                await addDoc(collection(db, "menu"), {
                    nama: namaMenu,
                    harga: hargaMenu
                });

                alert(`Menu "${namaMenu}" berhasil ditambahkan!`);

                document.getElementById("inputNamaMenu").value = "";
                document.getElementById("inputHargaMenu").value = "";
            } catch (error) {
                console.error("Gagal menambah menu:", error);
                alert("Gagal menyimpan menu baru: " + error.message);
            }
        };
    </script>
</body>
</html>
