<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Panel Admin</title>
</head>
<body>
   <div class="login-container">
        <h2>Login Panel Admin</h2>
        <form id="loginForm">
            <input type="email" id="email" placeholder="Email Admin" required><br><br>
            <input type="password" id="password" placeholder="Password" required><br><br>
            <button type="submit">Login</button>
        </form>
        <p id="errorMessage" style="color: text; color: red;"></p>
    </div>

    <script type="module">
        import { auth } from './main.js';
        import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        // Cek Otomatis: Kalau ternyata admin SUDAH login, langsung lempar ke index.html (dashboard)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = "index.html";
            }
        });

        
        const form = document.getElementById('loginForm'); 
        const pesanError = document.getElementById('errorMessage');

        form.addEventListener('submit', (e) => {
            e.preventDefault(); 
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

        
            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    
                    window.location.href = "index.html";
                })
                .catch((error) => {
                    
                    pesanError.innerText = "Email atau Password Salah!";
                    console.error("Firebase Error:", error.message);
                });
        });

        
    </script>
</body>
</html>
